name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Allow only one deployment at a time; let an in-flight production deployment
# finish rather than cancelling it mid-flight.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Publishes the built app to the user-page repo, which GitHub Pages
      # serves at https://screamxy.github.io. Requires the repo secret
      # ACTIONS_DEPLOY_KEY: an SSH private key whose public half is registered
      # as a write-access deploy key on ScreamXY/screamxy.github.io.
      - name: Publish to screamxy.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          external_repository: ScreamXY/screamxy.github.io
          publish_branch: master
          publish_dir: dist/heischwumm/browser
