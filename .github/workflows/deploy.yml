name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'AGENTS.md', 'CLAUDE.md', 'SECURITY.md', 'docs/**', 'AppStore/**', 'Measurements/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one deployment at a time; let an in-flight production deployment
# finish rather than cancelling it mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        timeout-minutes: 4
        run: npm ci

      - name: Build for GitHub Pages
        # Project site served from https://screamxy.github.io/heischwumm/
        run: npm run build -- --base-href /heischwumm/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/heischwumm/browser

  deploy:
    timeout-minutes: 5
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
