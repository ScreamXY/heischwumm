name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one deployment at a time; let an in-flight production deployment
# finish rather than cancelling it mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages
        # Project site served from https://screamxy.github.io/heischwumm/.
        # The root of screamxy.github.io is the ScreamXY portal
        # (ScreamXY/screamxy.github.io), which links here.
        run: npm run build -- --base-href /heischwumm/

      - name: Add SPA fallback
        # The app uses hash routing, so deep links never reach the server, but
        # GitHub Pages serves 404.html for unknown paths; the app shell there
        # keeps mistyped URLs inside the app.
        run: cp dist/heischwumm/browser/index.html dist/heischwumm/browser/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/heischwumm/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
