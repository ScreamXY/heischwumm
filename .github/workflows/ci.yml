name: CI

on:
  push:
    branches: [master]
    paths-ignore: ['README.md', 'AGENTS.md', 'CLAUDE.md', 'SECURITY.md', 'docs/**', 'AppStore/**', 'Measurements/**']
  pull_request:
    paths-ignore: ['README.md', 'AGENTS.md', 'CLAUDE.md', 'SECURITY.md', 'docs/**', 'AppStore/**', 'Measurements/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit tests & build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        timeout-minutes: 4
        run: npm ci

      - name: Typecheck (app, unit specs, e2e specs)
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
